[project]
name = "kcopa-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docx2txt>=0.9",
    "fastapi[standard]>=0.120.1",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.0.0",
    "langchain[google-genai]>=1.0.2",
    "langsmith>=0.4.38",
    "pydantic-settings>=2.11.0",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = ["langchain-chroma>=1.0.0", "ruff>=0.14.2"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
ignore = ["E501"]


[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.uv.workspace]
members = [
    "mcp-servers/test-to-sql",
]
